name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - name: Bundle adb
        run: go run ./tools/fetchadb -out internal/adb/bin
      - run: go vet ./...
      - run: go test ./...
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # MSYS2 supplies only gcc for cgo; inherit keeps setup-go's Go on the path.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Bundle adb
        run: go run ./tools/fetchadb -out internal/adb/bin
      - run: go vet ./...
      - run: go test ./...
